name: iOS ad-hoc IPA

on:
  workflow_dispatch:
    inputs:
      stage_verified_build20:
        description: Stage exact verified build20 artifact only (no rebuild)
        type: boolean
        required: false
        default: false
  push:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  ipa:
    if: ${{ inputs.stage_verified_build20 != true }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build unsigned iOS app and ad-hoc sign
        env:
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          VOICE_TOKEN_SERVER: "true"
          VOICE_TOKEN_ENDPOINT: ${{ vars.VOICE_TOKEN_ENDPOINT }}
        run: |
          set -euo pipefail
          umask 077
          python3 tool/write_dart_defines.py tool/livekit.defines.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('tool/livekit.defines.json')
          data = json.loads(p.read_text())
          data.pop('LIVEKIT_API_SECRET', None)
          data.pop('LIVEKIT_API_KEY', None)
          data['VOICE_TOKEN_SERVER'] = 'true'
          import os
          data['VOICE_TOKEN_ENDPOINT'] = os.environ.get('VOICE_TOKEN_ENDPOINT', '')
          p.write_text(json.dumps(data))
          PY
          export CODE_SIGNING_ALLOWED=NO
          flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols --dart-define-from-file=tool/livekit.defines.json
          rm -f tool/livekit.defines.json
          bash tool/package_adhoc_ipa.sh build/ios/iphoneos/Runner.app Echo99.ipa
      - name: Upload IPA to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" Echo99.ipa --clobber
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: echo99-adhoc-ipa
          path: Echo99.ipa

  stage-verified-build20:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/repair/build-fix-1.3.2' && inputs.stage_verified_build20 == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: stage-verified-test20
      cancel-in-progress: false
    steps:
      - name: Verify and stage existing build20 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import hashlib,json,subprocess,zipfile,io,plistlib,urllib.parse
          REPO='AliHusseinAlMarfadi96/echo99-release'
          BASE='repos/'+REPO
          SHA='14d8da73d1f13e9114d3263316880a6be5ba86ad'
          RUN=42324099479
          ART=13554501992
          RID=437242658
          TAG='v1.3.5-test.20'
          NAME='Echo99-1.3.5-build20-14d8da7.ipa'
          HASH='081d0c3ce753ac3b88c4b53bf25d914acedc7b10b39ef768b5185a29e032ee82'
          def api(path):
           return json.loads(subprocess.check_output(['gh','api',BASE+'/'+path]))
          def digest(b): return hashlib.sha256(b).hexdigest()
          def assert_ok(ok,label):
           if not ok: raise RuntimeError('Verification failed: '+label)
          def fingerprint(r):
           return {k:r.get(k) for k in ['id','tag_name','target_commitish','draft','prerelease','body','published_at','assets']}
          old={i:fingerprint(api('releases/'+str(i))) for i in [437126322,437091336,437021308,435898907]}
          assert_ok(api('releases/latest')['id']==435898907,'stable latest before')
          r=api('actions/runs/'+str(RUN))
          assert_ok(r['head_sha']==SHA and r['conclusion']=='success' and r['status']=='completed' and r['head_branch']=='repair/build-fix-1.3.2' and r['event']=='workflow_dispatch' and r['path']=='.github/workflows/ios-adhoc-ipa.yml','successful source run')
          a=api('actions/artifacts/'+str(ART))
          assert_ok(a['id']==ART and a['name']=='echo99-adhoc-ipa' and not a['expired'] and a['workflow_run']['id']==RUN and a['workflow_run']['head_sha']==SHA,'artifact identity')
          z=subprocess.check_output(['gh','api',BASE+'/actions/artifacts/'+str(ART)+'/zip'])
          assert_ok(digest(z)=='c61fc5cdf74ff276b0e125a64cc6be6184bc54dd46e3bd73c3570b2b07dae504','artifact archive hash')
          with zipfile.ZipFile(io.BytesIO(z)) as archive:
           files=[x for x in archive.namelist() if not x.endswith('/')]
           assert_ok(files==['Echo99.ipa'],'exact artifact contents')
           ipa=archive.read('Echo99.ipa')
          assert_ok(len(ipa)==25688738 and digest(ipa)==HASH,'IPA exact bytes')
          with zipfile.ZipFile(io.BytesIO(ipa)) as app:
           p=plistlib.loads(app.read('Payload/Runner.app/Info.plist'))
           assert_ok(p['CFBundleShortVersionString']=='1.3.5' and str(p['CFBundleVersion'])=='20' and p['MinimumOSVersion']=='15.0' and p['CFBundleIdentifier']=='com.echo99.echo99','IPA version')
           assert_ok('Payload/Runner.app/Frameworks/objective_c.framework/objective_c' in app.namelist(),'native asset retained')
          d=api('releases/'+str(RID))
          assert_ok(d['draft'] and d['prerelease'] and d['target_commitish']=='repair/build-fix-1.3.2' and not d['assets'] and d['name']=='Echo99 iPhone 1.3.5 Build 20 - Movement and Accessible Table Test' and SHA in d['body'] and HASH in d['body'],'existing private draft')
          assert_ok(d['tag_name'] in (None, '', 'untagged-b6334acbab5631087b03', TAG),'draft tag identity')
          refs=api('git/matching-refs/tags/'+TAG)
          assert_ok(not refs,'test20 tag must not exist')
          open(NAME,'wb').write(ipa)
          # API upload stays inside this repository runner using its short-lived job token.
          url=d['upload_url'].split('{')[0]+'?name='+urllib.parse.quote(NAME)
          raw=subprocess.check_output(['gh','api','--method','POST',url,'-H','Content-Type: application/octet-stream','--input',NAME])
          u=json.loads(raw)
          assert_ok(u['name']==NAME and u['size']==len(ipa) and u['state']=='uploaded' and u.get('digest')=='sha256:'+HASH,'uploaded asset digest')
          check=subprocess.check_output(['gh','api',BASE+'/releases/assets/'+str(u['id']),'-H','Accept: application/octet-stream'])
          assert_ok(digest(check)==HASH,'uploaded readback exact bytes')
          assert_ok(all(fingerprint(api('releases/'+str(i)))==v for i,v in old.items()),'old releases unchanged before publication')
          print('Staged exact verified IPA in private draft:',RID)
          print('Asset:',u['id'],u['name'],u['digest'])
          PY
